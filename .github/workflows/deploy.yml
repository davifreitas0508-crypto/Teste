name: Deploy Nexo to GitHub Pages

on:
  push:
    branches: [claude/nexo-translator-app-t0f7nl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: nexo

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: npm run build
        working-directory: nexo
        env:
          VITE_BASE_URL: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nexo/dist

      - uses: actions/deploy-pages@v4
        id: deployment
